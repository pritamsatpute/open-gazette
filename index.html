<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Open Gazette - A modern digital publication."
  >

  <title>Open Gazette</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="assets/icons/favicon.svg"
  >

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div class="site-wrapper">
    <header class="site-header">
      <div class="container site-header__container">
        <a class="site-header__brand" href="index.html" aria-label="Open Gazette home">
          <img class="site-header__logo site-header__logo--light" src="assets/logos/open-gazette-light.svg"
            alt="Open Gazette">
    
          <img class="site-header__logo site-header__logo--dark" src="assets/logos/open-gazette-dark.svg" alt="">
        </a>
    
        <nav class="site-navigation" id="site-navigation" aria-label="Primary navigation">
          <ul class="site-navigation__list">
            <li>
              <a class="site-navigation__link is-active" href="index.html">
                Home
              </a>
            </li>
    
            <li>
              <a class="site-navigation__link" href="#latest">
                Latest
              </a>
            </li>
    
            <li>
              <a class="site-navigation__link" href="#trending">
                Trending
              </a>
            </li>
    
            <li>
              <a class="site-navigation__link" href="#categories">
                Categories
              </a>
            </li>
    
            <li>
              <a class="site-navigation__link" href="#about">
                About
              </a>
            </li>
          </ul>
        </nav>
    
        <div class="site-header__actions">
          <button class="header-button" type="button" aria-label="Search">
            <span class="header-button__icon">⌕</span>
          </button>
    
          <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
            <span class="theme-toggle__light">☀</span>
            <span class="theme-toggle__dark">☾</span>
          </button>
    
          <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"
            aria-controls="site-navigation">
            <span class="menu-toggle__line"></span>
            <span class="menu-toggle__line"></span>
            <span class="menu-toggle__line"></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="container">
        <h1>Open Gazette</h1>
        <p>A modern digital publication.</p>
      </section>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
